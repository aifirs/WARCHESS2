steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Ensure index.html exists
    run: |
      if [ ! -f "index.html" ]; then
        echo "index.html not found — aborting"
        exit 1
      fi

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install Supabase CLI
    run: npm install -g supabase

  - name: Link Supabase project
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    run: |
      if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
        echo "SUPABASE_PROJECT_REF or SUPABASE_ACCESS_TOKEN secret is missing"
        exit 1
      fi
      SUPABASE_ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" supabase link --project-ref "$SUPABASE_PROJECT_REF"

  - name: Upload static files to Supabase Storage
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    run: |
      set -e
      BUCKET=warchess2-static
      SUPABASE_ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" supabase storage create "$BUCKET" || true
      SUPABASE_ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" supabase storage upload "$BUCKET" . --recursive

  - name: Done
    run: echo "Supabase deploy step finished. Check Supabase dashboard or action logs for details."
