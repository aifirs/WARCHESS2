name: Deploy WARCHESS 2 to Supabase

on:
  push:
    branches: [arena/019f90ae-warchess2, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link project
        run: supabase link --project-ref xtnegqwiprzutbirlhxc
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy static files
        run: |
          echo "Deploying WARCHESS 2 static assets to Supabase..."
          # Статические файлы готовы к загрузке в Storage или через хостинг
          # См. deploy.sh для ручной загрузки
          ls -la

      - name: Build info
        run: |
          echo "Project: WARCHESS 2"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deploy target: https://supabase.com/dashboard/project/xtnegqwiprzutbirlhxc"
        run: |
        
          echo "Commit: ${{ github.sha }}"
          echo "Deploy target: https://supabase.com/dashboard/project/xtnegqwiprzutbirlhxc"
