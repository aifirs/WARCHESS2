<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="WARCHESS 2 — эпическая шахматная битва империй. Рим против Македонии. Обучение, AI, мультиплеер." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WARCHESS 2" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>WARCHESS 2 — War of Epoch</title>

  <!-- Open Graph / Social (beautiful bookmark preview) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="WARCHESS 2 — War of Epoch" />
  <meta property="og:description" content="Эпическая шахматная битва империй. Рим против Македонии." />
  <meta property="og:image" content="assets/images/splash.jpg" />
  <meta property="og:url" content="https://github.com/aifirs/WARCHESS2" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WARCHESS 2 — War of Epoch" />
  <meta name="twitter:description" content="Эпическая шахматная битва империй. Рим против Македонии." />
  <meta name="twitter:image" content="assets/images/splash.jpg" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon_192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/icon_512.png" />
  <link rel="apple-touch-icon" href="assets/images/icon_192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <!-- Background -->
  <div class="bg-hero" aria-hidden="true"></div>

  <!-- Main App -->
  <div id="app" class="app">

    <!-- Header -->
    <header class="app-header" role="banner">
      <div class="logo-area">
        <h1 class="logo-title"><span class="w2-gold">WARCHESS</span> <span class="w2-red">2</span></h1>
        <p class="logo-sub" data-i18n="subtitle">ВОЙНА ЭПОХ</p>
      </div>
      <div class="header-actions">
        <button id="lang-btn" class="btn-icon" aria-label="Switch language" onclick="toggleLang()">RU / EN</button>
        <button id="menu-btn" class="btn-icon" aria-label="Menu" onclick="openMenu()">☰</button>
      </div>
    </header>

    <!-- Main Menu -->
    <main id="main-menu" class="main-menu" role="main">
      <section class="hero-card" aria-label="Game introduction">
        <img src="assets/images/splash.jpg" alt="WARCHESS 2 — War of Epoch splash" class="hero-img" loading="eager" />
        <div class="hero-overlay">
          <h2 class="hero-title" data-i18n="heroTitle">АЛЕКСАНДР <span class="hero-vs">VS</span> ЦЕЗАРЬ</h2>
          <p class="hero-desc" data-i18n="heroDesc">Эпическая битва империй. Рим. Македония. Греция.</p>
        </div>
      </section>

      <nav class="mode-nav" aria-label="Game modes">
        <a href="#" class="mode-card mode-training" onclick="startMode('training'); return false;" aria-label="Start Training mode">
          <span class="mode-icon" aria-hidden="true">⚔</span>
          <h3 data-i18n="modeTraining">ОБУЧЕНИЕ</h3>
          <p data-i18n="modeTrainingDesc">Изучи правила и тактику</p>
        </a>
        <a href="#" class="mode-card mode-ai" onclick="startMode('ai'); return false;" aria-label="Start AI mode">
          <span class="mode-icon" aria-hidden="true">♟</span>
          <h3 data-i18n="modeAI">AI MODE</h3>
          <p data-i18n="modeAIDesc">Против машины</p>
        </a>
        <a href="#" class="mode-card mode-1v1" onclick="startMode('1v1'); return false;" aria-label="Start 1v1 invite mode">
          <span class="mode-icon" aria-hidden="true">⚡</span>
          <h3 data-i18n="mode1v1">ОДИН НА ОДИН</h3>
          <p data-i18n="mode1v1Desc">Пригласительная ссылка</p>
        </a>
      </nav>
    </main>

    <!-- Game Area (hidden initially) -->
    <main id="game-area" class="game-area" role="main" hidden>
      <section class="game-top" aria-label="Game info">
        <div class="player-card player-rome">
          <img src="assets/images/pieces_white.png" alt="Rome" class="player-avatar" />
          <h4>РИМ (ЦЕЗАРЬ)</h4>
          <span class="timer" id="timer-white">10:00</span>
        </div>
        <div class="game-status" id="game-status" aria-live="polite">Готов к битве</div>
        <div class="player-card player-macedonia">
          <img src="assets/images/pieces_black.png" alt="Macedonia" class="player-avatar" />
          <h4>МАКЕДОНИЯ (АЛЕКСАНДР)</h4>
          <span class="timer" id="timer-black">10:00</span>
        </div>
      </section>

      <section class="board-wrapper" aria-label="Chess board">
        <div class="board" id="chessboard" role="region" aria-label="Chess board 8 by 8">
          <!-- Board cells generated by JS -->
        </div>
      </section>

      <section class="game-controls" aria-label="Game controls">
        <button class="btn-primary" onclick="backToMenu()" data-i18n="btnMenu">МЕНЮ</button>
        <button class="btn-primary" onclick="newGame()" data-i18n="btnNew">НОВАЯ ПАРТИЯ</button>
        <button class="btn-gold" onclick="inviteLink()" data-i18n="btnInvite">ПРИГЛАСИТЬ</button>
      </section>
    </main>

    <!-- Side / Bottom Menu -->
    <aside id="side-menu" class="side-menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
      <div class="side-menu-inner">
        <h2 data-i18n="menuTitle">НАСТРОЙКИ</h2>
        <button onclick="closeMenu(); toggleLang();" data-i18n="btnLang">СМЕНИТЬ ЯЗЫК</button>
        <button onclick="closeMenu(); startMode('training');" data-i18n="btnTrain">ОБУЧЕНИЕ</button>
        <button onclick="closeMenu(); startMode('ai');" data-i18n="btnAI">AI MODE</button>
        <div style="margin: 0.5rem 0; text-align: left; font-size: 0.8rem; color: var(--text-sub); letter-spacing: 0.05em;" data-i18n="aiDifficulty">AI СЛОЖНОСТЬ:</div>
        <div style="display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: flex-start;">
          <button onclick="closeMenu(); window.aiEngine && window.aiEngine.setDifficulty('easy'); startMode('ai');" style="flex:1; padding:0.5rem; font-size:0.75rem; background: var(--bg-card); color: var(--gold); border: 1px solid rgba(200,168,92,0.2); border-radius:6px;" data-i18n="aiEasy">ЛЁГКО</button>
          <button onclick="closeMenu(); window.aiEngine && window.aiEngine.setDifficulty('medium'); startMode('ai');" style="flex:1; padding:0.5rem; font-size:0.75rem; background: var(--bg-card); color: var(--gold); border: 1px solid rgba(200,168,92,0.2); border-radius:6px;" data-i18n="aiMedium">СРЕДНЕ</button>
          <button onclick="closeMenu(); window.aiEngine && window.aiEngine.setDifficulty('hard'); startMode('ai');" style="flex:1; padding:0.5rem; font-size:0.75rem; background: var(--bg-card); color: var(--gold); border: 1px solid rgba(200,168,92,0.2); border-radius:6px;" data-i18n="aiHard">СЛОЖНО</button>
        </div>
        <button onclick="closeMenu(); startMode('1v1');" data-i18n="btn1v1">ОДИН НА ОДИН</button>
        <button onclick="closeMenu();" class="btn-close" data-i18n="btnClose">ЗАКРЫТЬ</button>
      </div>
    </aside>
  </div>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/chess_engine.js"></script>
  <script src="js/training.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/multiplayer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
